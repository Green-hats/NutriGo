# mypy 配置 — NutriGo Agent
# 运行：uv run mypy app/ recognition/

[mypy]
python_version = 3.13
# 检查未标注的返回类型
check_untyped_defs = true
# 忽略缺失的第三方库类型（litellm/transformers 等无 stubs）
ignore_missing_imports = true
# 不要求显式返回类型（避免大量改动）
disallow_untyped_defs = false
# 允许 Optional 简化（X | None 而非 Optional[X]）
explicit_package_bases = true
