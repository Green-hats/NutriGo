[project]
name = "nutrigo-agent"
version = "0.1.0"
description = "NutriGo AI Agent — 营养分析、食物识别、RAG 对话"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.50",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "transformers>=4.50",
    "torch>=2.0",
    "pillow>=10.0",
    "chromadb>=0.5",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "recognition"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# 不联网、不加载模型，纯单元测试
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
# 确保从任意位置运行 pytest 都能 import app/（CI 未安装项目包时尤其必要）
pythonpath = ["."]
