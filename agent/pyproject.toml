[project]
name = "nutrigo-agent"
version = "0.1.0"
description = "NutriGo AI Agent — 营养分析、食物识别、RAG 对话"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.50",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "transformers>=4.50",
    "torch>=2.0",
    "pillow>=10.0",
    "chromadb>=0.5",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "recognition"]
