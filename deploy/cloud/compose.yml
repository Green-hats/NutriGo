name: nutrigo-cloud

services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?请配置 API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDY_CONFIG_FILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    working_dir: /data
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?请设置强随机 JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置强随机 INTERNAL_TOKEN}
      UNATTACHED_IMAGE_RETENTION_DAYS: ${UNATTACHED_IMAGE_RETENTION_DAYS:-7}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.agent
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      JWT_SECRET: ${JWT_SECRET:?请设置强随机 JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置强随机 INTERNAL_TOKEN}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_MODEL_PATH: ${RAG_MODEL_PATH:-BAAI/bge-small-zh-v1.5}
      FOOD_RECOGNITION_ENABLED: ${FOOD_RECOGNITION_ENABLED:-true}
      FOOD_VISION_MODEL: ${FOOD_VISION_MODEL:-deepseek-flash}
      FOOD_VISION_API_KEY: ${FOOD_VISION_API_KEY:-}
      FOOD_MODEL_PATH: ${FOOD_MODEL_PATH:-OFA-Sys/chinese-clip-vit-base-patch16}
      FOOD_MODEL_INT8: ${FOOD_MODEL_INT8:-false}
      FOOD_MODEL_PRELOAD: ${FOOD_MODEL_PRELOAD:-true}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-300}
      GO_BACKEND_URL: http://backend:3333
      DATABASE_PATH: /app/agent/data/agent.db
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - agent-data:/app/agent/data
      - chroma-data:/app/agent/chroma_db
      - model-data:/models
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

  backup:
    image: python:3.13-slim
    profiles: [maintenance]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - backend-data:/source/backend
      - agent-data:/source/agent
      - ./backup:/scripts:ro
      - ../../backups:/backups
    command: [python, /scripts/backup.py, create, --backend, /source/backend, --agent, /source/agent, --destination, /backups, --keep, "${BACKUP_KEEP:-14}"]

volumes:
  caddy-data:
  caddy-config:
  backend-data:
  agent-data:
  chroma-data:
  model-data:
