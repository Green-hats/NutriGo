name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # 1. Lint — 代码风格检查
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps (ruff)
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint Python (ruff)
        working-directory: agent
        run: ruff check app/ recognition/

      - name: Type check Python (mypy)
        working-directory: agent
        run: |
          python -m pip install mypy
          mypy app/ recognition/

      - name: Lint Frontend (oxlint)
        working-directory: frontend
        run: npx oxlint src

      - name: Go vet
        working-directory: backend
        run: go vet ./...

  # ============================================================
  # 2. Test — 单元测试（无需启动服务）
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Go unit tests
        working-directory: backend
        run: go test ./internal/...

      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: npx vitest run

  # ============================================================
  # 3. Build — 构建验证
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Go backend
        working-directory: backend
        run: go build ./...

      - name: Build frontend
        working-directory: frontend
        run: npm run build
