name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # 1. Lint — 代码风格检查
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps (ruff)
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint Python (ruff)
        working-directory: agent
        run: ruff check app/ recognition/ tests/

      - name: Type check Python (mypy)
        working-directory: agent
        run: |
          python -m pip install mypy
          mypy app/ recognition/

      - name: Lint Frontend (oxlint)
        working-directory: frontend
        run: npx oxlint src

      - name: Go vet
        working-directory: backend
        run: go vet ./...

  # ============================================================
  # 2. Test — 单元测试（无需启动服务）
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Go unit tests
        working-directory: backend
        run: go test ./internal/...

      # Go 集成测试：构建并启动真实服务，跑 test_api.py（67 用例）
      # 放大限流参数，避免本地 IP 的 8 次认证请求触发 429
      - name: Go integration tests (test_api.py)
        working-directory: backend
        env:
          AUTH_RATE_LIMIT_PER_MIN: '1000'
          AUTH_RATE_LIMIT_BURST: '1000'
        run: |
          go build -o /tmp/nutrigo-server ./cmd/server
          /tmp/nutrigo-server > /tmp/nutrigo-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3333/api/health >/dev/null 2>&1; then
              echo "server ready (try $i)"
              break
            fi
            sleep 1
          done
          python3 ../test/backend/test_api.py

      - name: Install Agent test deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiosqlite httpx chromadb python-dotenv pydantic

      - name: Agent unit tests (pytest)
        working-directory: agent
        run: pytest

      - name: Frontend unit tests (vitest)
        working-directory: frontend
        run: npx vitest run

  # ============================================================
  # 3. Build — 构建验证
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Go backend
        working-directory: backend
        run: go build ./...

      - name: Build frontend
        working-directory: frontend
        run: npm run build
