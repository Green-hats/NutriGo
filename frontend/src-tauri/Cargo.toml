[package]
name = "nutrigo"
version = "0.1.5"
description = "NutriGo mobile nutrition assistant"
authors = ["NutriGo contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/Green-hats/NutriGo"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nutrigo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-http = "2"
