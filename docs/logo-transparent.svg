<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="NutriGo">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#276749" /><stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" /><stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="leafLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" /><stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" /><stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" /><stop offset="100%" stop-color="#C62828" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" /><stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1B4332" flood-opacity="0.1" />
    </filter>
  </defs>
<g filter="url(#softShadow)">
  <g transform="translate(250, 270)">
    <!-- 深绿主叶（左后） -->
    <g transform="translate(-24, -58) rotate(-30)">
      <path d="M 0 -26 Q -15 -9 0 11 Q 15 -9 0 -26 Z" fill="url(#leafDark)" />
      <path d="M 0 -20 L 0 5" stroke="#FCFDFD" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <!-- 橙子切片 -->
    <g transform="translate(-42, -26) rotate(-38)">
      <path d="M -14 0 A 14 14 0 0 1 14 0 Z" fill="url(#orangeGrad)" />
      <path d="M -9 -1 A 9 9 0 0 1 9 -1 Z" fill="#FFE0B2" opacity="0.9" />
    </g>
    <!-- 红浆果 -->
    <g transform="translate(-16, -26)">
      <circle cx="0" cy="0" r="6.5" fill="url(#berryGrad)" />
      <circle cx="-1.4" cy="-1.4" r="1.4" fill="#FFEBEE" opacity="0.85" />
    </g>
    <!-- 鲜绿主叶（右后） -->
    <g transform="translate(22, -62) rotate(22)">
      <path d="M 0 -24 Q -13 -8 0 10 Q 13 -8 0 -24 Z" fill="url(#leafLight)" />
      <path d="M 0 -18 L 0 4" stroke="#FCFDFD" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <!-- 黄瓜/牛油果切片 -->
    <g transform="translate(36, -24) rotate(15)">
      <circle cx="0" cy="0" r="12" fill="#81C784" />
      <circle cx="0" cy="0" r="7.5" fill="#E8F5E9" />
      <circle cx="0" cy="0" r="2.5" fill="#2E7D32" opacity="0.6" />
    </g>
    <!-- AI 星 -->
    <g transform="translate(0, -42)">
      <path d="M 0 -25 Q 0 -6 16 -6 Q 0 -6 0 9 Q 0 -6 -16 -6 Q 0 -6 0 -25 Z" fill="#FCFDFD" />
      <path d="M 0 -21 Q 0 -5 13 -5 Q 0 -5 0 7 Q 0 -5 -13 -5 Q 0 -5 0 -21 Z" fill="url(#starGrad)" />
      <circle cx="0" cy="-5" r="1.8" fill="#FFFFFF" />
    </g>
    <!-- 碗 -->
    <path d="M -65 0 A 65 38 0 0 0 65 0 Z" fill="url(#bowlGrad)" />
    <path d="M -65 0 Q 0 6 65 0 Q 0 2.5 -65 0 Z" fill="#52B788" opacity="0.95" />
  </g>
</g></svg>