<title id="title">NutriGo 系统架构</title><desc id="desc">Android 1.0.0 通过 HTTPS 和 JWT 访问 Caddy，再进入 Go 数据服务或 Python Agent；生产已部署提交 6ddfe4d3。聊天只接受 POST JSON 和 SSE。旧客户端仍可使用基础数据与 CLIP 接口，但旧 GET 聊天已停用。Agent 访问本地会话、营养库和 RAG，并调用外部聊天模型与 DeepSeek 视觉 API。异地备份和通知入口尚未配置。</desc>
